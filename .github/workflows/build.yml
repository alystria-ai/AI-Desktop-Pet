# Release workflow — builds installers for all three OSes with tauri-action and
# publishes ONE GitHub release containing every platform artifact (v1 shipped
# three separate per-OS releases; this replaces that).
#
# Trigger: push a stable version tag like v2.0.0. Manifest and lockfile
# versions must already match the tag (see BUILDING.md → Release process).
#
# The release is created ONCE up front (create-release), then every platform
# job uploads into it by id. Letting each matrix job find-or-create the release
# by tag races — two jobs create it at the same instant and you get a stray
# `untagged-…` draft holding half the artifacts (happened on v2.1.5).
#
# NOTE: uses the automatic `secrets.GITHUB_TOKEN`.
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the draft release once so every build job uploads into the same one.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Expected a stable version tag, received ${tag}`);
            }
            const version = tag.slice(1);
            const json = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
            const lock = json('package-lock.json');
            const versions = {
              'package.json': json('package.json').version,
              'package-lock.json': lock.version,
              'package-lock.json root package': lock.packages[''].version,
              'src-tauri/tauri.conf.json': json('src-tauri/tauri.conf.json').version,
              'src-tauri/Cargo.toml': fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
                .match(/\[package\][\s\S]*?^version = "([^"]+)"/m)?.[1],
              'src-tauri/Cargo.lock': fs.readFileSync('src-tauri/Cargo.lock', 'utf8')
                .match(/name = "convai-desktop-pet"\r?\nversion = "([^"]+)"/)?.[1],
            };
            for (const [path, actual] of Object.entries(versions)) {
              if (actual !== version) throw new Error(`${path}: ${actual} does not match ${tag}`);
            }

      - uses: actions/github-script@v7
        id: mk
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { owner, repo } = context.repo;
            // Reuse the same release on a re-run, including one already published.
            const rels = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let rel = rels.find((r) => r.tag_name === tag);
            if (!rel) {
              const res = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Convai Desktop Pets ${tag}`,
                body: 'Release notes are being generated…',
                draft: true,
                prerelease: false,
              });
              rel = res.data;
            }
            core.setOutput('release_id', String(rel.id));

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          # 24.04, not 22.04: xcap's libspa bindings need PipeWire >= 1.0
          # headers (22.04 ships 0.3.48, which no longer matches the crate).
          - platform: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cross-compilation targets are only needed on the macOS runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        # Beyond the standard Tauri set: xcap (native screen capture for the
        # vision feature) builds against PipeWire/Wayland/EGL/DBus dev libs.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into one draft. The final job validates every platform,
          # adds checksums and notes, and publishes only after all builds pass.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Keep partial builds private. Publish the complete set with explicit tag
  # metadata so a body-only PATCH cannot turn it into an untagged draft.
  publish-release:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write commit-based release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          {
            echo "## Changes"
            echo ""
            # One section per commit: subject as heading, body (already
            # markdown bullets by commit convention) as the detail. Version
            # bump commits carry no information — skip them.
            if [ -n "$PREV" ]; then
              git log --no-merges --reverse --invert-grep --grep='^Bump version' \
                --pretty=format:'### %s%n%n%b' "${PREV}..${TAG}"
              echo ""
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --no-merges --reverse --invert-grep --grep='^Bump version' \
                --pretty=format:'### %s%n%n%b' "${TAG}"
            fi
            echo ""
            echo "**Source commit:** [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo ""
            echo "Installers: Windows x64, macOS Apple Silicon and Intel, Linux x64 (.deb and .AppImage)."
            echo "Verify downloads with the attached SHA256SUMS.txt."
          } > notes.md

      - name: Verify assets and publish the complete release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.slice(1);
            const expected = [
              `Convai.Desktop.Pets_${version}_x64-setup.exe`,
              `Convai.Desktop.Pets_${version}_aarch64.dmg`,
              `Convai.Desktop.Pets_${version}_x64.dmg`,
              `Convai.Desktop.Pets_${version}_amd64.deb`,
              `Convai.Desktop.Pets_${version}_amd64.AppImage`,
            ];
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });
            const lines = expected.map((name) => {
              const asset = assets.find((item) => item.name === name);
              if (!asset || asset.state !== 'uploaded' || asset.size <= 0 ||
                  !/^sha256:[a-f0-9]{64}$/.test(asset.digest ?? '')) {
                throw new Error(`Installer missing, empty, or lacking a SHA-256 digest: ${name}`);
              }
              return `${asset.digest.slice(7)}  ${name}`;
            });
            const oldChecksums = assets.find((item) => item.name === 'SHA256SUMS.txt');
            if (oldChecksums) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: oldChecksums.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'SHA256SUMS.txt',
              data: Buffer.from(lines.join('\n') + '\n'),
              headers: { 'content-type': 'text/plain' },
            });
            const { data: release } = await github.rest.repos.updateRelease({
              owner, repo, release_id,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Convai Desktop Pets ${tag}`,
              body: fs.readFileSync('notes.md', 'utf8'),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            if (release.tag_name !== tag || release.draft || release.prerelease) {
              throw new Error(`Release publication did not preserve ${tag}`);
            }
            core.info(`Published ${release.html_url} with all five installers and SHA256SUMS.txt`);
